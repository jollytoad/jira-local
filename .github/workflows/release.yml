name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          cache: true

      - name: Check tag matches version
        run: |
          version=$(jq -r .version deno.json)
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Release tag $tag does not match deno.json version $version"
            exit 1
          fi

      - name: Refresh the generated version
        run: deno task version && git diff --exit-code src/version.ts

      - name: Build targets
        run: |
          version=$(jq -r .version deno.json)
          : > "jira-local-v$version-checksums.txt"
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            deno compile -P --app-name jira-local --output "jira-local-$target" --target "$target" src/cli.ts
            cp "jira-local-$target" jira-local
            tar -czf "jira-local-v$version-$target.tar.gz" jira-local
            rm jira-local
            sha256sum "jira-local-v$version-$target.tar.gz" >> "jira-local-v$version-checksums.txt"
          done

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version deno.json)
          gh release upload "${{ github.event.release.tag_name }}" \
            jira-local-v*.tar.gz "jira-local-v$version-checksums.txt" --clobber

      - name: Generate formula
        run: |
          version=$(jq -r .version deno.json)
          sha() { awk -v asset="jira-local-v$version-$1.tar.gz" '$2 == asset { print $1 }' "jira-local-v$version-checksums.txt"; }
          mkdir -p Formula
          cat > Formula/cli.rb <<EOF
          class Cli < Formula
            desc "Mirror a Jira Cloud project to local markdown files"
            homepage "https://github.com/jollytoad/jira-local"
            version "$version"
            on_macos do
              on_arm do
                url "https://github.com/jollytoad/jira-local/releases/download/v#{version}/jira-local-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "https://github.com/jollytoad/jira-local/releases/download/v#{version}/jira-local-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end
            on_linux do
              on_arm do
                url "https://github.com/jollytoad/jira-local/releases/download/v#{version}/jira-local-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "https://github.com/jollytoad/jira-local/releases/download/v#{version}/jira-local-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end
            def install
              bin.install "jira-local"
            end
            livecheck do
              url "https://github.com/jollytoad/jira-local"
              strategy :github_releases
            end
          end
          EOF

      - name: Commit formula
        run: |
          version=$(jq -r .version deno.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cli.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged"
            exit 0
          fi
          git commit -m "Update formula for v$version [skip ci]"
          git push origin HEAD:main
