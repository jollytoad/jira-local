name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Check tag matches version
        run: |
          version=$(jq -r .version deno.json)
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Release tag $tag does not match deno.json version $version"
            exit 1
          fi

      - name: Verify formatting
        run: deno fmt --check

      - name: Run linter
        run: deno lint

      - name: Run TypeScript checking
        run: deno check

      - name: Publish dry run
        run: deno publish --dry-run

      - name: Publish package
        run: deno publish
